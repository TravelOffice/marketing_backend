# Controls when the workflow will run
name: OnClosePR

on:
  # Triggers the workflow on close pull request events but only for the dev and master branch
  pull_request:
    branches: [ dev, master ]
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  ACTOR_NAME: ${{ github.event.pull_request.user.login }}
  TF_BUCKET: ${{ secrets.TF_BUCKET }}

jobs:
  clean_service_for_testing:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x ]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Install nodejs
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # Install TypeScript
      - name: Install TypeScript
        run: npm install -g typescript

      # Get all changed files to get changed services
      - id: get-changed-files
        uses: Ana06/get-changed-files@v2.1.0

      - name: Get the removed service name
        id: get-removed-services-name
        run: |
          REMOVED_SERVICES=
          for removed_file in ${{ steps.get-changed-files.outputs.removed }}; do
            SERVICE=$(echo ${removed_file} | grep -oE "src/modules/.*" | grep -E "app.ts|lambda.ts" | sed -E 's/src\/modules\///g' | sed -E 's/\/.*//g')
            if [ ! -z ${SERVICE} ]; then
              if [[ "${REMOVED_SERVICES}" != *"${SERVICE}"* ]]; then
                REMOVED_SERVICES="${SERVICE} ${REMOVED_SERVICES}"
              fi
            fi
          done
          if [ -z "${REMOVED_SERVICES}" ]; then
            echo "::notice::GetRemovedServices Not found any removed services!!"
          else
            echo "Removed service: ${REMOVED_SERVICES}"
            echo "::notice::GetRemovedServices Removed service: ${REMOVED_SERVICES}"
          fi
          echo ::set-output name=services-removed::"${REMOVED_SERVICES}"

      - name: Get the deployment service name
        id: get-deployment-services-name
        run: |
          REMOVED_SERVICES="${{ steps.get-removed-services-name.outputs.services-removed }}"
          DEPLOYMENT_SERVICES=
          for changed_file in ${{ steps.get-changed-files.outputs.all }}; do
            SERVICE=$(echo ${changed_file} | grep -oE "src/modules/.*" | sed -E 's/src\/modules\///g' | sed -E 's/\/.*//g')
            if [ ! -z ${SERVICE} ]; then
              if [[ "${DEPLOYMENT_SERVICES}" != *"${SERVICE}"* && "${REMOVED_SERVICES}" != *"${SERVICE}"* ]]; then
                DEPLOYMENT_SERVICES="${SERVICE} ${DEPLOYMENT_SERVICES}"
              fi
            fi
          done
          if [ -z "${DEPLOYMENT_SERVICES}" ]; then
            echo "::notice::GetDeploymentServices Not found any deployment services!!"
            echo ::set-output name=services-existed::false
          else
            echo "::notice::GetDeploymentServices Deployment service: ${DEPLOYMENT_SERVICES}"
            echo "DEPLOYMENT_SERVICES=${DEPLOYMENT_SERVICES}" >> $GITHUB_ENV
            echo ::set-output name=services-existed::true
            echo ::set-output name=deployment-services::${DEPLOYMENT_SERVICES}
          fi
      # Build serverless
      - name: Build service
        if: ${{ steps.get-deployment-services-name.outputs.services-existed == 'true' }}
        run: |
          ./scripts/build_serverless.sh ${{ secrets.BUILD_ENV }}

      # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
      - name: Setup Terraform
        if: ${{ steps.get-deployment-services-name.outputs.services-existed == 'true' }}
        uses: hashicorp/setup-terraform@v1

      # Provision cognito and ApiGateway
      - name: Provision Lambda and ApiGateway
        if: ${{ steps.get-deployment-services-name.outputs.services-existed == 'true' }}
        run: |
          ./scripts/aws_deploy.sh ${{ secrets.BUILD_ENV }} destroy
