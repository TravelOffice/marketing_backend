# Controls when the workflow will run
name: OnClosePR

on:
  # Triggers the workflow on close pull request events but only for the dev and master branch
  pull_request:
    branches: [ dev, master ]
    types:
      - closed

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  ACTOR_NAME: ${{ github.event.pull_request.user.login }}
  TF_BUCKET: ${{ secrets.TF_BUCKET }}

jobs:
  clean_service_for_testing:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [14.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Install nodejs
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # Install TypeScript
      - name: Install TypeScript
        run: npm install -g typescript

      - id: get-changed-files
        uses: Ana06/get-changed-files@v2.1.0

      - name: Get the build service name
        run: |
          CHANGED_SERVICES=
          for changed_file in ${{ steps.get-changed-files.outputs.all }}; do
            SERVICE=$(echo ${changed_file} | grep -oE "src/modules/.*" | sed -E 's/src\/modules\///g' | sed -E 's/\/.*//g')
            if [ ! -z ${SERVICE} ]; then
              if [[ "${CHANGED_SERVICES}" != *"${SERVICE}"* ]]; then
                CHANGED_SERVICES="${SERVICE} ${CHANGED_SERVICES}"
              fi
            fi
          done
          if [ -z ${SERVICE} ]; then
            echo "Not found any services changed!"
            echo ::set-output name=services-existed::false
          else
            echo "CHANGED_SERVICES=${CHANGED_SERVICES}" >> $GITHUB_ENV
            echo ::set-output name=services-existed::true
          fi

      # Build serverless
      - name: Build service
        if: ${{ steps.get-services-name.outputs.services-existed == 'true' }}
        run: |
          for SERVICE in ${{ env.CHANGED_SERVICES }}; do
            ./scripts/build_service.sh ${{ secrets.BUILD_ENV }} ${SERVICE}
          done

      # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
      - name: Setup Terraform
        if: ${{ steps.get-services-name.outputs.services-existed == 'true' }}
        uses: hashicorp/setup-terraform@v1

      # Provision lambda and ApiGateway
      - name: Provision Lambda and ApiGateway
        if: ${{ steps.get-services-name.outputs.services-existed == 'true' }}
        run: |
          ./scripts/aws_deploy.sh ${{ secrets.BUILD_ENV }} destroy
