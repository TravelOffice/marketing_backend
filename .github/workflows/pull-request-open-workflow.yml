name: OnOpenPR

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ dev, master ]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  ACTOR_NAME: ${{ github.event.pull_request.user.login }}
  TF_BUCKET: ${{ secrets.TF_BUCKET }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  general-requirements:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    # Map a step output to a job output
    outputs:
      deployment-services: ${{ steps.get-deployment-services-name.outputs.deployment-services }}
      services-existed: ${{ steps.get-deployment-services-name.outputs.services-existed }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Validate pull request
      - name: Validate Pull Request
        id: validate-pull-request
        run: |
          if [ -z ${{ github.event.pull_request.assignee }} ]; then
            echo "::error::PullRequestValidation Missing assignee!" && exit 1
          fi

      # Get all changed files to get changed services
      - id: get-changed-files
        uses: Ana06/get-changed-files@v2.1.0

      - name: Get the removed service name
        id: get-removed-services-name
        run: |
          REMOVED_SERVICES=
          for removed_file in ${{ steps.get-changed-files.outputs.removed }}; do
            SERVICE=$(echo ${removed_file} | grep -oE "src/modules/.*" | grep -E "app.ts|lambda.ts" | sed -E 's/src\/modules\///g' | sed -E 's/\/.*//g')
            if [ ! -z ${SERVICE} ]; then
              if [[ "${REMOVED_SERVICES}" != *"${SERVICE}"* ]]; then
                REMOVED_SERVICES="${SERVICE} ${REMOVED_SERVICES}"
              fi
            fi
          done
          if [ -z "${REMOVED_SERVICES}" ]; then
            echo "::notice::GetRemovedServices Not found any removed services!!"
          else
            echo "Removed service: ${REMOVED_SERVICES}"
            echo "::notice::GetRemovedServices Removed service: ${REMOVED_SERVICES}"
          fi
          echo ::set-output name=services-removed::"${REMOVED_SERVICES}"

      - name: Get the deployment service name
        id: get-deployment-services-name
        run: |
          REMOVED_SERVICES="${{ steps.get-removed-services-name.outputs.services-removed }}"
          DEPLOYMENT_SERVICES=
          for changed_file in ${{ steps.get-changed-files.outputs.all }}; do
            SERVICE=$(echo ${changed_file} | grep -oE "src/modules/.*" | sed -E 's/src\/modules\///g' | sed -E 's/\/.*//g')
            if [ ! -z ${SERVICE} ]; then
              if [[ "${DEPLOYMENT_SERVICES}" != *"${SERVICE}"* && "${REMOVED_SERVICES}" != *"${SERVICE}"* ]]; then
                DEPLOYMENT_SERVICES="${SERVICE} ${DEPLOYMENT_SERVICES}"
              fi
            fi
          done
          if [ -z "${DEPLOYMENT_SERVICES}" ]; then
            echo "::notice::GetDeploymentServices Not found any deployment services!!"
            echo ::set-output name=services-existed::false
          else
            echo "::notice::GetDeploymentServices Deployment service: ${DEPLOYMENT_SERVICES}"
            echo "DEPLOYMENT_SERVICES=${DEPLOYMENT_SERVICES}" >> $GITHUB_ENV
            echo ::set-output name=services-existed::true
            echo ::set-output name=deployment-services::${DEPLOYMENT_SERVICES}
          fi

  run-lint-check:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    needs: ['general-requirements']

    strategy:
      matrix:
        node-version: [14.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Install nodejs
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # Install TypeScript
      - name: Install TypeScript
        run: npm install -g typescript

      - name: Get the change service name
        id: get-deployment-services-name
        run: echo "DEPLOYMENT_SERVICES=${{ needs.general-requirements.outputs.deployment-services }}" >> $GITHUB_ENV

      # Run lint check
      - name: Run Lint
        if: ${{ needs.general-requirements.outputs.services-existed == 'true' }}
        run: |
          echo "Run Lint check for services: ${DEPLOYMENT_SERVICES}"
          chmod +x ./scripts/*.sh
          ./scripts/run_lint_check.sh

  provision_service_for_testing:
    runs-on: ubuntu-latest
    needs: [
      'general-requirements',
      'run-lint-check'
    ]

    strategy:
      matrix:
        node-version: [14.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Install nodejs
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # Install TypeScript
      - name: Install TypeScript
        run: npm install -g typescript

      - name: Get the change service name
        id: get-deployment-services-name
        run: echo "DEPLOYMENT_SERVICES=${{ needs.general-requirements.outputs.deployment-services }}" >> $GITHUB_ENV

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Build serverless
      - name: Build service
        if: ${{ needs.general-requirements.outputs.services-existed == 'true' }}
        run: |
          for SERVICE in ${DEPLOYMENT_SERVICES}; do
            ./scripts/build_service.sh ${{ secrets.BUILD_ENV }} ${SERVICE}
          done

      # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
      
      # Provision lambda and ApiGateway
      - name: Provision Lambda and ApiGateway
        if: ${{ needs.general-requirements.outputs.services-existed == 'true' }}
        run: |
          ./scripts/aws_deploy.sh ${{ secrets.BUILD_ENV }} deploy
      
      # Get the invoke url of ApiGateway
      - name: Get the invoke url of ApiGateway
        if: ${{ needs.general-requirements.outputs.services-existed == 'true' }}
        run: |
          cd deploy2aws/environments/dev/
          output=$(terraform output)
          echo "::add-mask::${output}"

  # Run terraform to check the deployment in infrastructure
  run-infrastructure-check:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    needs: ['run-lint-check']

    strategy:
      matrix:
        node-version: [14.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Install nodejs
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # Install TypeScript
      - name: Install TypeScript
        run: npm install -g typescript

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Build serverless
      - name: Build serverless
        run: ./scripts/build_serverless.sh ${{ secrets.BUILD_ENV }}

      # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1

      # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
      - name: Terraform Init
        run: ./scripts/execute_terraform.sh ${{ secrets.BUILD_ENV }} init -backend-config "bucket=${{ secrets.TF_BUCKET }}"

      # # Checks that all Terraform configuration files adhere to a canonical format
      # - name: Terraform Format
      #   run: ./scripts/execute_terraform.sh ${{ secrets.BUILD_ENV }} fmt -check

      # Checks that all Terraform syntax
      - name: Terraform Validate
        run: ./scripts/execute_terraform.sh ${{ secrets.BUILD_ENV }} validate

      # Generates an execution plan for Terraform
      - name: Terraform Plan
        run: ./scripts/execute_terraform.sh ${{ secrets.BUILD_ENV }} plan -var="TF_BUCKET=${{ secrets.TF_BUCKET }}" -var="ENV=${{ secrets.BUILD_ENV }}"
