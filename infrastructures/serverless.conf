API_ENDPOINTS = {
  "/chat-fb-webhook" = {
    "GET" = {
      lambda_name   = "chat_appsync_fb_webhook_service"
      authorization = false
    },
    "POST" = {
      lambda_name   = "chat_appsync_fb_webhook_service"
      authorization = false
    }
  },
  "/chat-zalo-webhook" = {
    "POST" = {
      lambda_name   = "chat_appsync_zalo_webhook_service"
      authorization = false
    }
  },
  "/presigned-url" = {
    "GET" = {
      lambda_name   = "presigned_url_service"
      authorization = true
    }
  },
  "/facebook/link" = {
    "POST" = {
      lambda_name   = "link_facebook_page_service"
      authorization = true
    }
  },
  "/zalo/link" = {
    "GET" = {
      lambda_name   = "link_zalo_page_service"
      authorization = true
    },
    "POST" = {
      lambda_name   = "link_zalo_page_service"
      authorization = true
    }
  },
  "/upload-file-to-chat-platform" = {
    "GET" = {
      lambda_name   = "upload_file_to_chat_platform_service"
      authorization = true
    }
  },
  "/leads" = {
    "POST" = {
      lambda_name   = "lead_service"
      authorization = true
    },
    "PUT" = {
      lambda_name   = "lead_service"
      authorization = true
    },
    "GET" = {
      lambda_name   = "lead_service"
      authorization = true
    }
  },
  "/leads/{leadID}" = {
    "GET" = {
      lambda_name   = "lead_service"
      authorization = true
    }
  },
  "/leads/{leadID}/opportunities" = {
    "GET" = {
      lambda_name = "opportunity_service"
      authorization = true
    }
  },
  "/leads/{leadID}/opportunities/{opportunityID}" = {
    "PUT" = {
      lambda_name = "opportunity_service"
      authorization = true
    },
    "GET" = {
      lambda_name = "opportunity_service"
      authorization = true
    }
  },
  "/opportunities" = {
    "GET" = {
      lambda_name = "opportunity_service"
      authorization = true
    }
  },
  "/opportunities/:id" = {
    "DELETE" = {
      lambda_name = "opportunity_service"
      authorization = true
    }
  }
}

