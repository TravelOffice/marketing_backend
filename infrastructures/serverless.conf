# LAMBDA_FUNCTIONS
# Name	        | Type	       |  Default               |Required
# path          | string       |                        |  Yes
# layers        | list(string) |                        |  Yes
# handler       | string       |  index.handler         |  No
# memory_size   | number       |  128                   |  No
# runtime       | string       |  nodejs14.x            |  No
# timeout       | number       |  3                     |  No
# architecture  | string       |  arm64                 |  No
# log_retention | number       |  7                     |  No
# iam_role      | string       |  standard_lambda_role  |  No
# env_vars      | string       |  standard_vars         |  No

LAMBDA_FUNCTIONS = {
  "chat_appsync_fb_webhook_service" = {
    path        = "src/modules/chat_appsync_fb_webhook_service/dist",
    memory_size = 256
    layers      = ["chat_appsync_fb_webhook_service"]
  },
  "chat_appsync_resolver_service" = {
    path     = "src/modules/chat_appsync_resolver_service/dist",
    layers   = ["chat_appsync_resolver_service"]
    iam_role = "read_write_dynamodb_lambda_role"
  },
  "chat_appsync_zalo_webhook_service" = {
    path        = "src/modules/chat_appsync_zalo_webhook_service/dist",
    memory_size = 256
    layers      = ["chat_appsync_zalo_webhook_service"]
  },
  "presigned_url_service" = {
    path     = "src/modules/presigned_url_service/dist"
    layers   = ["presigned_url_service"]
    env_vars = "s3_presigned_url_vars"
  },
  "link_zalo_page_service" = {
    path     = "src/modules/link_zalo_page_service/dist",
    layers   = ["link_zalo_page_service"]
    env_vars = "zalo_page_vars"
    iam_role = "read_write_dynamodb_lambda_role"
  },
  "upload_file_to_chat_platform_service" = {
    path        = "src/modules/upload_file_to_chat_platform_service/dist"
    layers      = ["upload_file_to_chat_platform_service"]
    iam_role    = "read_write_dynamodb_lambda_role"
    env_vars    = "s3_presigned_url_vars"
  }
}

API_ENDPOINTS = {
  "/chat-fb-webhook" = {
    "GET" = {
      lambda_name   = "chat_appsync_fb_webhook_service"
      authorization = false
    },
    "POST" = {
      lambda_name   = "chat_appsync_fb_webhook_service"
      authorization = false
    }
  },
  "/chat-zalo-webhook" = {
    "POST" = {
      lambda_name   = "chat_appsync_zalo_webhook_service"
      authorization = false
    }
  },
  "/presigned-url" = {
    "GET" = {
      lambda_name   = "presigned_url_service"
      authorization = true
    }
  },
  "/zalo/link" = {
    "GET" = {
      lambda_name   = "link_zalo_page_service"
      authorization = true
    },
    "POST" = {
      lambda_name   = "link_zalo_page_service"
      authorization = true
    }
  },
  "/upload-file-to-chat-platform" = {
    "GET" = {
      lambda_name = "upload_file_to_chat_platform_service"
      authorization = true
    }
  }
}

