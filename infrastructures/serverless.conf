APPSYNC_FUNCTIONS = {
  verifyPage = {
    request_template = {
      path = "src/appsync/functions/verify_page/request_mapping.vtl"
    },
    response_template = {
      path = "src/appsync/functions/verify_page/response_mapping.vtl"
    },
    data_source = "dynamodb_datasource"
  },
  commonInvoke = {
    request_template = {
      path = "src/appsync/functions/common_invoke/request_mapping.vtl"
    },
    response_template = {
      path = "src/appsync/functions/common_invoke/response_mapping.vtl"
    },
    data_source = "lambda_datasource"
  },
}

# The following arguments are supported:

# type - (Required) The type name from the schema defined in the GraphQL API.
# field - (Required) The field name from the schema defined in the GraphQL API.
# request_template - (Optional) The request mapping template for UNIT resolver or 'before mapping template' for PIPELINE resolver. Required for non-Lambda resolvers.
# response_template - (Optional) The response mapping template for UNIT resolver or 'after mapping template' for PIPELINE resolver. Required for non-Lambda resolvers.
# data_source - (Optional) The DataSource name only affect when kind is UNIT.
# kind - (Optional) The resolver type. Valid values are UNIT and PIPELINE. Default is UNIT
# pipeline_config - (Optional) The PipelineConfig.
#   functions - (Required) The list of Function ID.
# caching_config - (Optional) The CachingConfig.
#   caching_keys - (Optional) The list of caching key.
#   ttl - (Optional) The TTL in seconds.
# Example:
# APPSYNC_RESOLVERS = {
#   example_resolver = {
#       type              = "Query"
#       field             = "exampleResolver"
#       kind              = "UNIT"
#       request_template  = {
#         path = "path_to_request_template"
#       },
#       response_template = {
#         path = "path_to_response_template"
#       },
#       data_source = "lambda_datasource"
#       caching_config    = [{
#         caching_keys  = [
#           "$context.arguments.id", #cache key
#         ]
#         ttl           = 60
#       }]
#   },
#   example_resolver_with_pipeline = {
#       type              = "Mutation"
#       field             = "exampleResolverWithPipeline"
#       kind              = "PIPELINE"
#       request_template  = {
#         path = "path_to_request_template"
#       },
#       response_template = {
#         path = "path_to_response_template"
#       },
#       pipeline_config   =  {
#         functions = [
#           "functionId1",
#           "functionId2"
#         ]
