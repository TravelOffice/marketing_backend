version: 0.2
phases:
  pre_build:
    commands:
      - chmod +x ./scripts/execute_terraform.sh
      - ./scripts/execute_terraform.sh $BUILD_ENV init -backend-config "bucket=$TF_BUCKET"
      - ./scripts/execute_terraform.sh $BUILD_ENV validate
  
  build:
    commands:
      - ls -la
      - ./scripts/execute_terraform.sh $BUILD_ENV plan -var-file="root_infra_output.tfvars"
